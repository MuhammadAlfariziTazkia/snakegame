<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakegame</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-5">
    <div class="container d-flex justify-content-center align-items-center game-container">
        <div id="mainDiv" class="card game-panel">
            <h1 class="mb-3 game-title">Snake Game</h1>
            <h3 id="score" class="mb-3 score-display">Score: 0</h3>
            <h5 id="lose-description" class="lose-description"></h5>
            <table id="arena" border="1"></table>
            <button id="play-button" class="btn btn-dark mb-3 mt-2" onclick="gameStarted()">Play Game</button>
            <a href="https://saweria.co/farizproject" class="developer-credit" target="blank">Support this project (Saweria)</a>
            <p class="mt-3 developer-credit">Developed by @muhammadalfarizi.t</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="constant.js"></script>
    <script src="die.js"></script>
    <script src="helper.js"></script>
    <script src="state.js"></script>
    <script src="controller.js"></script>
</body>
</html>
